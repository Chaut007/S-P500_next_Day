# Central configuration. Nothing in src/ may hard-code these values.

project:
  name: SP555
  random_state: 42

data:
  start_date: "2016-01-01"
  end_date: "2025-12-31"

  index_ticker: "^GSPC"

  # Market cap must be built from the split-adjusted, dividend-UNadjusted close.
  # "Adj Close" also removes dividends, which pushes historical prices down by
  # roughly 20% over ten years and corrupts the market-cap ranking.
  price_col: "Close"

  gold_ticker: "GLD"          # ETF: trades on the US equity calendar
  fred_series: ["DGS10", "DGS2", "T10Y2Y"]

  download_batch_size: 60     # tickers per yfinance request
  max_missing_ratio: 0.5      # drop a ticker if more than this fraction is missing

target:
  horizon: 1                  # predict the index close at t + horizon

features:
  top_n: 10

  # The headline comparison runs on one feature set. C wins the ablation on
  # every metric (MAE 295.5 vs 319.4 and 343.6), so it is the set the four
  # models are compared on.
  best_set: "C"

  trend:
    momentum_windows: [5, 20]
    ma_window: 20

  # Ablation ladder. Each set adds one layer on top of the previous.
  sets:
    A: ["mcap"]
    B: ["mcap", "trend"]
    C: ["mcap", "trend", "macro"]

split:
  # Chronological 80/20. The tail 20% is the test set and is never used for
  # fitting, scaling or model selection.
  test_ratio: 0.2

  # Expanding window, kept for the ablation that chooses the feature set.
  validation_years: [2020, 2021, 2022, 2023, 2024, 2025]
  gap: 1                      # rows skipped between train and validation

model:
  eval_metric: "r2"
  presets: "medium_quality"
  time_limit: 240             # seconds per fold
  # LR must stay in this list. Tree models cannot predict above the highest
  # target value seen in training, and the index roughly triples over the
  # study window, so a linear learner is required for the later folds.
  included_model_types: ["LR", "GBM", "CAT", "XGB", "RF"]

# The four model families compared head to head on the 80/20 split.
zoo:
  svr:
    kernel: "rbf"
    C: 100.0
    epsilon: 0.1
    gamma: "scale"

  xgboost:
    n_estimators: 600
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8

  lstm:
    window: 20                # trading days fed to the network
    hidden_size: 64
    num_layers: 2
    dropout: 0.2
    epochs: 60
    batch_size: 64
    learning_rate: 0.001
    patience: 10              # early stopping on the tail of the training block
    # The target is standardised, never min-max scaled. A [0,1] target puts a
    # hard ceiling on the output layer, and 98% of the test block sits above
    # the training maximum, so the network could not reach it by construction.

explain:
  shap_background: 200        # rows sampled for the SHAP background set
  shap_sample: 400            # test rows explained
  permutation_repeats: 10

dashboard:
  race_freq: "ME"             # month-end frames; daily would be ~2515 frames
  race_top_n: 10
  # race_fps and race_seconds_per_frame went with the pre-rendered MP4. The
  # leaderboard is a Plotly animation now, so the reader sets the pace.

logging:
  level: INFO
  max_bytes: 5242880
  backup_count: 5
